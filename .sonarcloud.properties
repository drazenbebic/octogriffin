# Prisma generates the migrations, and SonarQube checks their Postgres SQL
# against Oracle PL/SQL rules
sonar.exclusions=apps/web/prisma/migrations/**

# Analyse the tests, and the in-memory fakes they share, as test code
sonar.test.inclusions=**/*.test.ts,**/*.test.tsx,apps/web/src/rewards/testFakes.ts
